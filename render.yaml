databases:
  - name: avicoleguard-db
    databaseName: avicoleguard
    user: avicoleguard
    plan: free

services:
  - type: redis
    name: avicoleguard-redis
    plan: free
    ipAllowList: [] # internal only

  - type: web
    name: avicoleguard-api
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: avicoleguard-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: avicoleguard-redis
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: "4"
    plan: free

  - type: worker
    name: avicoleguard-celery
    env: python
    buildCommand: "./build.sh"
    startCommand: "celery -A config worker -l info"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: avicoleguard-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: avicoleguard-redis
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
    plan: free

  - type: worker
    name: avicoleguard-celery-beat
    env: python
    buildCommand: "./build.sh"
    startCommand: "celery -A config beat -l info"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: avicoleguard-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: avicoleguard-redis
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
    plan: free
